<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>99Apps</title>
<meta name="description"
content="99Apps develops simple, powerful and beautifully designed Android applications.">
    
<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#ffffff;
    --muted:#94a3b8;
    --accent:#6366f1;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:system-ui,-apple-system,sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

/* Header */

.header{
    text-align:center;
    margin-bottom:50px;
}

.logo{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:15px;
    border:3px solid rgba(255,255,255,.1);
}

.brand{
    font-size:2rem;
    font-weight:700;
}

.subtitle{
    color:var(--muted);
    margin-top:8px;
}

/* Apps Grid */

.apps-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

/* App Card */

.app-card{
    background:var(--card);
    border-radius:20px;
    padding:20px;
    text-align:center;
    transition:.25s;
}

.app-card:hover{
    transform:translateY(-5px);
}

.app-icon{
    width:90px;
    height:90px;
    border-radius:22px;
    object-fit:cover;
    margin-bottom:15px;
}

.app-name{
    font-size:1.2rem;
    font-weight:600;
    margin-bottom:10px;
}

.app-desc{
    color:var(--muted);
    font-size:.95rem;
    margin-bottom:18px;
    min-height:45px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    background:var(--accent);
    color:white;
    padding:10px 18px;
    border-radius:12px;
    font-weight:600;
    transition:.2s;
}

.btn:hover{
    opacity:.9;
}

/* Footer */

.footer{
    margin-top:60px;
    padding:30px 20px;
    text-align:center;
    border-top:1px solid rgba(255,255,255,.08);
}

.footer a{
    color:var(--muted);
    text-decoration:none;
    margin:0 8px;
}

.footer a:hover{
    color:white;
}

.footer span{
    color:#64748b;
}

.footer p{
    margin-top:15px;
    color:#64748b;
    font-size:.9rem;
}

/* Mobile */

@media (max-width:600px){

    .logo{
        width:80px;
        height:80px;
    }

    .brand{
        font-size:1.7rem;
    }

    .container{
        padding:20px 15px;
    }
}

</style>
</head>
<body>

<div class="container">

    <!-- Brand Header -->

    <div class="header">

        <!-- Replace with your logo -->
        <img src="images/logo.jpg"
             alt="99Apps"
             class="logo">

        <div class="brand">99Apps</div>

        <div class="subtitle">
            Discover our Android apps
        </div>

    </div>

    <!-- Apps Grid -->

    <div class="apps-grid">

        <!-- Simple Torch -->

        <div class="app-card">

            <img src="images/simple_torch_app.jpg"
                 alt="Simple Torch"
                 class="app-icon">

            <div class="app-name">
                Simple Torch
            </div>

            <div class="app-desc">
                Modern flashlight with shake to toggle, themes and quick access.
            </div>

            <a class="btn"
               href="https://play.google.com/store/apps/details?id=com.apps99.simpletorch"
               target="_blank">
               Open App
            </a>

        </div>

        <!-- Future App Example -->

        <div class="app-card">

            <div style="font-size:70px;margin-bottom:10px;">
                🚀
            </div>

            <div class="app-name">
                Coming Soon
            </div>

            <div class="app-desc">
                More useful apps from 99Apps will appear here.
            </div>

        </div>

    </div>

</div>

<!-- Footer -->

<footer class="footer">

    <a href="privacy-policy.html">
        Privacy Policy
    </a>

    <span>•</span>

    <a href="mailto:support@99apps.com">
        Contact
    </a>

    <p>
        © 2026 99Apps. All Rights Reserved.
    </p>

</footer>

</body>
</html>
